name: rewind
description: Cross-platform instant-replay and automatic game-clip capture (Windows + macOS).
publish_to: "none"
version: 0.2.3

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0            # dart:ffi helpers for the libobs C shim
  path: ^1.9.0
  path_provider: ^2.1.0 # locate the clips directory per-OS
  hotkey_manager: ^0.2.3 # global hotkey (manual "clip that")
  tray_manager: ^0.5.3   # menu-bar / tray presence

  # Native build hooks — compile & bundle the C shim automatically.
  hooks: ^2.0.2
  code_assets: ^1.2.1
  native_toolchain_c: ^0.19.2
  talker_flutter: ^5.1.17
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  file_selector: ^1.1.0
  ffmpeg_kit_flutter_new: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  ffigen: ^20.1.1

flutter:
  uses-material-design: true
  assets:
    - assets/tray/
    # The bundled faces' licenses ship inside the app, not just in the repo
    # (SIL OFL §... requires the license to travel with the font). The .ttf
    # files themselves are declared under `fonts:` below, so they are NOT
    # listed here — that would bundle them a second time.
    - assets/fonts/OFL-Archivo.txt
    - assets/fonts/OFL-InterTight.txt
    - assets/fonts/OFL-IBMPlexMono.txt

  # Three OFL families, bundled so the UI renders identically on macOS and
  # Windows. Before this, every weight resolved to the platform UI face (SF
  # Pro vs Segoe UI Variable) — two different designs from one codebase, and
  # a type scale that could only ever be tuned for one of them. See
  # docs/superpowers/specs/2026-07-25-broadcast-deck-design-system.md §1.2.
  #
  # Archivo and Inter Tight ship as VARIABLE fonts (one file, `wght` axis).
  # Every style that needs a non-default weight sets `fontVariations`
  # alongside `fontWeight` — see `RewindTypography._wght` — because
  # `fontWeight` alone leaves a variable face at its default instance and
  # lets the engine synthesize a fake bold instead.
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Variable.ttf
    - family: InterTight
      fonts:
        - asset: assets/fonts/InterTight-Variable.ttf
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
