name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    name: Build & package macOS (.dmg)
    runs-on: macos-latest # Apple Silicon runner → arm64
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Real capture needs the pinned libobs SDK; without it the shim builds
      # in stub mode (no clips). Cache key must match ci.yml's.
      - name: Cache libobs SDK
        uses: actions/cache@v4
        with:
          path: native/third_party/obs
          key: libobs-${{ runner.arch }}-32.1.2-deps-2025-08-23-recipe-3
      - run: bash tools/fetch_libobs.sh

      - run: flutter config --enable-macos-desktop
      - run: flutter pub get

      # arm64-only: the fetched libobs is arm64, so a universal
      # (arm64+x86_64) link fails on the x86_64 slice. See the Packaging &
      # CI/CD task in ROADMAP.md for the universal-libobs follow-up.
      - name: Build (release, arm64)
        env:
          FLUTTER_XCODE_ARCHS: arm64
          FLUTTER_XCODE_ONLY_ACTIVE_ARCH: "YES"
          # No local Apple Development cert on CI runners; build unsigned and
          # let bundle_obs_macos.sh ad-hoc re-sign (matches the "unsigned for
          # now — right-click → Open" note in the README).
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED: "NO"
        run: flutter build macos --release

      # The Xcode "Bundle libobs runtime" phase runs this during the build,
      # but re-run it explicitly (idempotent) so a toolchain change can't
      # silently ship an app missing its libobs frameworks/plugins.
      - run: bash tools/bundle_obs_macos.sh build/macos/Build/Products/Release/rewind.app

      # Dependency-free DMG (pure hdiutil) — no appdmg/Node, unlike
      # flutter_distributor's macOS backend.
      - name: Package DMG
        run: bash tools/package_macos_dmg.sh build/macos/Build/Products/Release/rewind.app dist/Rewind-macos-arm64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: rewind-macos
          path: dist/Rewind-macos-arm64.dmg

  windows:
    name: Build & package Windows (installer + portable zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Real capture needs the pinned libobs SDK; without it the shim
      # builds in stub mode (no clips). dumpbin.exe/lib.exe (used to
      # synthesize obs.lib from the official prebuilt obs.dll) need a
      # Visual Studio Developer environment on PATH. Cache key must match
      # ci.yml's.
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Cache libobs SDK
        uses: actions/cache@v4
        with:
          path: native/third_party/obs
          key: libobs-windows-x64-32.1.2-recipe-3
      - run: ./tools/fetch_libobs_windows.ps1
        shell: pwsh

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      # ffmpeg_kit_flutter_new's Windows CMake extracts FFmpeg into its own
      # plugin dir, which Flutter reaches through a symlink — CMake refuses
      # to "extract through symlink". FFMPEGKIT_LOCAL_DIR is its escape
      # hatch; ci.yml does the same (see its longer note).
      - name: Prefetch FFmpegKit (Windows)
        shell: pwsh
        run: ./tools/prefetch_ffmpegkit_windows.ps1
      - run: flutter build windows --release

      - name: Bundle libobs runtime
        run: ./tools/bundle_obs_windows.ps1 build/windows/x64/runner/Release
        shell: pwsh

      # Gate on a self-contained bundle BEFORE packaging: v0.1.0 shipped an
      # installer and a zip whose binaries all imported the Visual C++
      # runtime that neither of them included, so the app died at process
      # start on any machine without Visual Studio — no window, no log.
      - name: Check bundle dependencies
        run: dart run tools/check_bundle_deps.dart build/windows/x64/runner/Release

      # And that the release build actually starts. Debug-mode run (the
      # integration-test harness builds its own binary), but it exercises
      # the same plugin + native-shim set this job just packaged.
      - name: Launch smoke test
        run: flutter test integration_test/launch_smoke_test.dart -d windows

      # Portable zip: the fully-bundled app (rewind.exe + libobs runtime +
      # data) staged under a top-level Rewind/ folder so it extracts cleanly.
      # For people who'd rather unzip and run than install.
      - name: Package portable zip
        run: |
          New-Item -ItemType Directory -Force -Path dist/Rewind | Out-Null
          Copy-Item build/windows/x64/runner/Release/* dist/Rewind -Recurse -Force
          Compress-Archive -Path dist/Rewind -DestinationPath dist/Rewind-windows-x64-portable.zip -Force
          Remove-Item -Recurse -Force dist/Rewind
        shell: pwsh

      # Inno Setup is the standard Windows installer builder (also what
      # flutter_distributor wraps for `.exe`); used directly here.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
        shell: pwsh
      # Stamp the installer with the tag's version (v0.2.0 -> 0.2.0), rather
      # than the fallback baked into the .iss — an installer that reports
      # the wrong version is indistinguishable from a stale build.
      - name: Build installer
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if (-not $version) { $version = '0.0.0' }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$version tools\windows_installer.iss
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: rewind-windows
          path: |
            dist/Rewind-windows-setup.exe
            dist/Rewind-windows-x64-portable.zip

  release:
    name: Draft GitHub Release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/**/*
